name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dtd
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: dtd_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtd -d dtd_booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dtd:ci_only@localhost:5432/dtd_booking_test
      DATABASE_URL_TEST: postgresql://dtd:ci_only@localhost:5432/dtd_booking_test
      AUTH_SECRET: ci-dummy-secret-not-used-in-production
      MAIL_FROM: ci@localhost
      MAIL_BRAND_NAME: CI Buchung
      # Dummy-Werte: kein Stripe-Account in CI; Webhooks werden im E2E selbst
      # signiert, der Secret-Key wird nur zur Client-Initialisierung gebraucht
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      CRON_SECRET: ci-cron-secret
      SEED_ADMIN_EMAIL: ci-admin@example.org
      SEED_ADMIN_PASSWORD: ci-admin-passwort-1
      SEED_CUSTOMER_EMAIL: ci-kunde@example.org
      SEED_CUSTOMER_PASSWORD: ci-kunde-passwort-1
      LOGIN_RATE_LIMIT: "1000"
      REGISTER_RATE_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4

      # pnpm-Version kommt aus dem packageManager-Feld der package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated/ ist gitignored – ohne Client fehlen die Prisma-Typen
      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # 3.7: kompletter Kaufflow (Registrierung → Kauf → signierte Webhooks →
      # Rechnung) läuft gegen den Production-Server (next start nutzt den
      # Build aus dem Build-Step; playwright.config startet in CI nur noch)
      - name: E2E tests
        run: pnpm e2e
