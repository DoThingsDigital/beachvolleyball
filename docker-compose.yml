services:
  db:
    image: postgres:16-alpine
    container_name: dtd-booking-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtd_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dtd_booking}
    volumes:
      - dtd_booking_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtd} -d ${POSTGRES_DB:-dtd_booking}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dtd_booking_pgdata:
